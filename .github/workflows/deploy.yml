name: Riatirimba ERP Uplink - September Build

on:
  workflow_dispatch:
  # push:
  #   branches: ["finance/fees-service"]

jobs:
  smart-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Detect changed services
        id: changed-services
        run: |
          echo "========================================"
          echo "Changed files:"
          echo "========================================"

          git diff --name-only HEAD^ HEAD || true

          echo ""

          CHANGED_SERVICES=""

          # ========================================
          # Finance Services
          # ========================================

          # fees-service
          if git diff --name-only HEAD^ HEAD | grep -q "^finance-service/fees/"; then
            echo "✓ fees-service changed"
            CHANGED_SERVICES="$CHANGED_SERVICES fees-service"
          else
            echo "✗ fees-service unchanged"
          fi

          # voucher-service
          if git diff --name-only HEAD^ HEAD | grep -q "^finance-service/voucher/"; then
            echo "✓ voucher-service changed"
            CHANGED_SERVICES="$CHANGED_SERVICES voucher-service"
          else
            echo "✗ voucher-service unchanged"
          fi

          # ========================================
          # Standard Services
          # ========================================

          for SERVICE in \
            academics-service \
            admission-service \
            auth-service \
            backup-service \
            filegate-service \
            students-service \
            nginx
          do
            if [ -d "$SERVICE" ]; then
              if git diff --name-only HEAD^ HEAD | grep -q "^$SERVICE/"; then
                echo "✓ $SERVICE changed"
                CHANGED_SERVICES="$CHANGED_SERVICES $SERVICE"
              else
                echo "✗ $SERVICE unchanged"
              fi
            else
              echo "⚠ $SERVICE directory not found"
            fi
          done

          # ========================================
          # Shared dependency/configuration changes
          # ========================================

          if git diff --name-only HEAD^ HEAD | grep -qE \
            '^(docker-compose\.yml|package\.json|package-lock\.json|yarn\.lock|pnpm-lock\.yaml)$'
          then
            echo ""
            echo "✓ Shared dependency/configuration changed"
            echo "→ Rebuilding all services"

            CHANGED_SERVICES="$CHANGED_SERVICES \
              fees-service \
              voucher-service \
              academics-service \
              admission-service \
              auth-service \
              backup-service \
              filegate-service \
              students-service \
              nginx"
          fi

          # Remove duplicates and normalize whitespace
          CHANGED_SERVICES=$(echo "$CHANGED_SERVICES" | xargs)

          # Remove duplicate service names
          CHANGED_SERVICES=$(echo "$CHANGED_SERVICES" | tr ' ' '\n' | sort -u | tr '\n' ' ' | xargs)

          echo ""
          echo "========================================"
          echo "Services to build:"
          echo "$CHANGED_SERVICES"
          echo "========================================"

          echo "CHANGED_SERVICES=$CHANGED_SERVICES" >> "$GITHUB_OUTPUT"

      - name: Build & Push changed services
        if: steps.changed-services.outputs.CHANGED_SERVICES != ''
        run: |
          set -e

          COMMIT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          CHANGED_SERVICES="${{ steps.changed-services.outputs.CHANGED_SERVICES }}"

          echo "========================================"
          echo "Commit SHA: $COMMIT_SHA"
          echo "Changed Services: $CHANGED_SERVICES"
          echo "========================================"

          for SERVICE in $CHANGED_SERVICES; do

            IMAGE_NAME="erp-$SERVICE"

            # ========================================
            # Map service -> Dockerfile + build context
            # ========================================

            case "$SERVICE" in

              fees-service)
                DOCKERFILE_PATH="./finance-service/fees/Dockerfile"
                BUILD_CONTEXT="./finance-service/fees"
                ;;

              voucher-service)
                DOCKERFILE_PATH="./finance-service/voucher/Dockerfile"
                BUILD_CONTEXT="./finance-service/voucher"
                ;;

              academics-service)
                DOCKERFILE_PATH="./academics-service/Dockerfile"
                BUILD_CONTEXT="./academics-service"
                ;;

              admission-service)
                DOCKERFILE_PATH="./admission-service/Dockerfile"
                BUILD_CONTEXT="./admission-service"
                ;;

              auth-service)
                DOCKERFILE_PATH="./auth-service/Dockerfile"
                BUILD_CONTEXT="./auth-service"
                ;;

              backup-service)
                DOCKERFILE_PATH="./backup-service/Dockerfile"
                BUILD_CONTEXT="./backup-service"
                ;;

              filegate-service)
                DOCKERFILE_PATH="./filegate-service/Dockerfile"
                BUILD_CONTEXT="./filegate-service"
                ;;

              students-service)
                DOCKERFILE_PATH="./students-service/Dockerfile"
                BUILD_CONTEXT="./students-service"
                ;;

              nginx)
                DOCKERFILE_PATH="./nginx/Dockerfile"
                BUILD_CONTEXT="./nginx"
                ;;

              *)
                echo "❌ Unknown service: $SERVICE"
                continue
                ;;
            esac

            echo ""
            echo "========================================"
            echo "SERVICE: $SERVICE"
            echo "IMAGE: $IMAGE_NAME"
            echo "DOCKERFILE: $DOCKERFILE_PATH"
            echo "CONTEXT: $BUILD_CONTEXT"
            echo "========================================"

            # ========================================
            # Verify Dockerfile
            # ========================================

            echo "Checking Dockerfile..."

            if [ ! -f "$DOCKERFILE_PATH" ]; then
              echo "❌ Dockerfile NOT FOUND:"
              echo "$DOCKERFILE_PATH"
              exit 1
            fi

            echo "✅ Dockerfile found"

            # ========================================
            # Verify build context
            # ========================================

            if [ ! -d "$BUILD_CONTEXT" ]; then
              echo "❌ Build context NOT FOUND:"
              echo "$BUILD_CONTEXT"
              exit 1
            fi

            echo "✅ Build context found"

            # ========================================
            # Build Docker image
            # ========================================

            echo ""
            echo "Building image..."

            docker build \
              --progress=plain \
              -f "$DOCKERFILE_PATH" \
              -t "${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:$COMMIT_SHA" \
              -t "${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:latest" \
              "$BUILD_CONTEXT"

            echo "✅ BUILD SUCCESSFUL"

            # ========================================
            # Push commit SHA tag
            # ========================================

            echo ""
            echo "Pushing SHA tag..."

            docker push \
              "${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:$COMMIT_SHA"

            # ========================================
            # Push latest tag
            # ========================================

            echo ""
            echo "Pushing latest tag..."

            docker push \
              "${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:latest"

            echo ""
            echo "✅ PUSH COMPLETE FOR $SERVICE"

          done

      - name: Skip build if no changes
        if: steps.changed-services.outputs.CHANGED_SERVICES == ''
        run: |
          echo "========================================"
          echo "No services changed."
          echo "Skipping Docker build."
          echo "========================================"